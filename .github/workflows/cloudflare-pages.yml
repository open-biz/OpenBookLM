name: Cloudflare Pages

on:
  push:
    branches: [cloudflare/pages]
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target (production requires an explicit manual run)"
        type: choice
        options: [preview, production]
        default: preview
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: ["openbooklm-web"]
    environment:
      name: ${{ inputs.target == 'production' && 'pages-production' || 'pages-preview' }}
    concurrency:
      group: pages-${{ matrix.app }}-${{ inputs.target || 'preview' }}
      cancel-in-progress: ${{ inputs.target != 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Install app dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Pages tooling
        run: npm ci --prefix .cloudflare --ignore-scripts --no-audit --no-fund
      - name: Check transport and deployment boundaries
        run: node --test .cloudflare/pages-handler.test.mjs .cloudflare/delivery.test.mjs
      - name: Build frontend and run local contract checks
        run: node .cloudflare/build.mjs "$PAGES_APP"
        env:
          PAGES_APP: ${{ matrix.app }}
          NEXT_PUBLIC_GOOGLE_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_API_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      - name: Stage self-contained Pages deployment
        run: node .cloudflare/stage.mjs "$PAGES_APP"
        env:
          PAGES_APP: ${{ matrix.app }}
      - name: Deploy to actual Cloudflare Pages
        run: node .cloudflare/deploy.mjs "$PAGES_APP" "$PAGES_TARGET"
        env:
          PAGES_APP: ${{ matrix.app }}
          PAGES_TARGET: ${{ inputs.target || 'preview' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
